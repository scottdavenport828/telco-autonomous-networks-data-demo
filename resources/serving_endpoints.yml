resources:
  serving_endpoints:
    claude_opus_47_gw:
      name: ${var.llm_endpoint}
      ai_gateway:
        usage_tracking_config:
          enabled: true
        inference_table_config:
          enabled: true
          catalog_name: ${var.catalog}
          schema_name: ${var.schema}
          table_name_prefix: gw_inference
        rate_limits:
          - calls: 200
            renewal_period: minute
            key: endpoint
        guardrails:
          input:
            pii:
              behavior: BLOCK
          output:
            pii:
              behavior: BLOCK
      config:
        served_entities:
          - name: claude-opus-4-7-anthropic
            external_model:
              name: claude-opus-4-7
              provider: anthropic
              task: llm/v1/chat
              anthropic_config:
                # Databricks secret reference. Provision the secret via notebooks/00_provision_secret.py.
                anthropic_api_key: "{{secrets/telco-rca/anthropic_api_key}}"
        traffic_config:
          routes:
            - served_entity_name: claude-opus-4-7-anthropic
              traffic_percentage: 100
