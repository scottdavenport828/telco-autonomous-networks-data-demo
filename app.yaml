command:
  - "uvicorn"
  - "tan.api.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: CATALOG
    value: srd_vibes_catalog
  - name: SCHEMA
    value: network_intel
  - name: VOLUME
    value: raw
  - name: LLM_ENDPOINT
    value: databricks-claude-opus-4-7
  - name: EMBEDDING_ENDPOINT
    value: databricks-gte-large-en
  - name: AGENT_ENDPOINT
    value: telco-rca-agents
  - name: VS_ENDPOINT
    value: srd-vibes-vs
  - name: RULES_INDEX
    value: rca_rules_vs_idx
  - name: INCIDENTS_INDEX
    value: incidents_vs_idx
  - name: SQL_WAREHOUSE_ID
    valueFrom: sql_warehouse
