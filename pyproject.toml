[project]
name = "telco-autonomous-networks-databricks"
version = "0.1.0"
description = "Databricks-native port of GCP telco-autonomous-networks-data-demo. Multi-agent RCA over LTE PM data on Unity Catalog + Mosaic AI."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }

dependencies = [
  "databricks-sdk>=0.40.0",
  "databricks-agents>=0.18.0",
  "databricks-vectorsearch>=0.49",
  "mlflow[databricks]>=2.20.0",
  "anthropic>=0.40.0",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tan*"]

[tool.ruff]
line-length = 100
target-version = "py311"
