bundle:
  name: telco-autonomous-networks-databricks

include:
  - resources/*.yml

sync:
  include:
    # DAB excludes non-source files by default; force-include the React build
    # so the FastAPI static mount finds it inside the app container.
    - tan/api/static/**

variables:
  catalog:
    description: Unity Catalog catalog used for telco demo data and registered models
    default: srd_vibes_catalog

  schema:
    description: UC schema for tables, volumes, models
    default: network_intel

  volume:
    description: UC volume for raw CSV / JSON fixtures
    default: raw

  llm_endpoint:
    description: |
      Native FMAPI Claude Opus 4.7 endpoint. AI Gateway features (rate limits,
      usage tracking, inference table, guardrails) are applied to this endpoint
      by `notebooks/04_apply_ai_gateway.py`.
    default: databricks-claude-opus-4-7

  embedding_endpoint:
    description: FMAPI embedding endpoint
    default: databricks-gte-large-en

  agent_endpoint:
    description: Mosaic AI agent serving endpoint
    default: telco-rca-agents

  vs_endpoint:
    description: Vector Search endpoint
    default: srd-vibes-vs

  rules_index:
    description: Vector Search index for RCA rules
    default: rca_rules_vs_idx

  incidents_index:
    description: Vector Search index for prior incidents
    default: incidents_vs_idx

  warehouse_id:
    description: Serverless SQL warehouse ID for the app to query Delta tables
    default: ""

  app_name:
    description: Databricks App name
    default: telco-rca

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-srd-vibes.cloud.databricks.com
      profile: srd-vibes
    run_as:
      user_name: ${workspace.current_user.userName}
